name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.1.1)"
        required: true
        default: "1.1.1"
        type: string
      uploadRelease:
        description: "Upload to GitHub Release"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: githubstar-windows-x64.exe
            asset_name: githubstar-windows-x64.exe

          - os: ubuntu-latest
            artifact_name: githubstar-linux-x64
            asset_name: githubstar-linux-x64
            chmod: true

          - os: macos-latest
            artifact_name: githubstar-macos-x64
            asset_name: githubstar-macos-x64
            chmod: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        run: |
          echo 'VERSION = "${{ inputs.version }}"' > src/githubstar/version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name ${{ matrix.artifact_name }} --clean src/githubstar/__main__.py

      - name: Make executable (Linux/macOS)
        if: matrix.chmod
        run: chmod +x dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Upload to Release
        if: inputs.uploadRelease
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: v${{ inputs.version }}
          overwrite: true
