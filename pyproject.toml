[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "githubstar"
dynamic = ["version"]
description = "Export Github starred repos list to file"
authors = [
    {name = "kevinapps@github"},
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["github", "star", "stars", "starred", "export"]
requires-python = ">=3.13"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]

dependencies = [
    "PyGithub >=1.59.1, <2.0.0",
    "requests >=2.34.2",
    "beautifulsoup4 >=4.15.0",
    "PySocks >=1.7.1",
    # transitive dependency of PyJWT[crypto] (via PyGithub); pinned to fix
    # GHSA (cryptography <50.0.0 Bleichenbacher oracle in PKCS#7 decryption)
    "cryptography >=50.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "githubstar.version.VERSION"}

[project.urls]
Homepage = "https://github.com/kevinapps/githubstar"

[project.scripts]
githubstar = "githubstar.githubstar:main"